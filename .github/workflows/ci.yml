name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: markdownlint
              uses: DavidAnson/markdownlint-cli2-action@v19
              with:
                  globs: |
                      skills/**/*.md
                      docs/**/*.md
                      README.md
                      CHANGELOG.md
                      CLAUDE.md
                      !skills/**/template/**

            - name: No hardcoded absolute paths
              run: |
                  if grep -rn '/Users/' skills/ docs/ README.md \
                      CLAUDE.md 2>/dev/null; then
                      echo "::error::Found hardcoded absolute paths"
                      exit 1
                  fi

            - name: Reference-file size cap (25 KB)
              run: |
                  OVERSIZED=$(find skills -name '*.md' \
                      -not -name 'SKILL.md' \
                      -path '*/references/*' -size +25k 2>/dev/null)
                  if [ -n "$OVERSIZED" ]; then
                      echo "::error::Reference files exceed 25KB:"
                      echo "$OVERSIZED"
                      exit 1
                  fi

            - name: Relative-path validation
              run: |
                  errors=0
                  while IFS= read -r file; do
                      dir=$(dirname "$file")
                      grep -oP '`(\.\./[^`]+\.md)`' "$file" \
                          | tr -d '`' | while read -r ref; do
                          target="$dir/$ref"
                          if [ ! -f "$target" ]; then
                              echo "::error file=$file::Broken path: $ref"
                              errors=$((errors + 1))
                          fi
                      done
                  done < <(find skills docs -name '*.md')
                  [ "$errors" -eq 0 ]

    pr-discipline:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check version bump
              continue-on-error: true
              run: |
                  PR_VERSION=$(jq -r '.version' \
                      .claude-plugin/plugin.json)
                  git fetch origin main --quiet
                  MAIN_VERSION=$(git show \
                      origin/main:.claude-plugin/plugin.json \
                      | jq -r '.version')
                  if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
                      echo "::warning::No version bump — no release on merge"
                      exit 1
                  fi

            - name: Check changelog updated
              continue-on-error: true
              run: |
                  PR_VERSION=$(jq -r '.version' \
                      .claude-plugin/plugin.json)
                  if ! grep -Eq "^## \[$PR_VERSION\]" CHANGELOG.md; then
                      echo "::warning::No CHANGELOG entry for $PR_VERSION"
                      exit 1
                  fi

            - name: Build script produces one zip per skill
              run: |
                  ./scripts/build-skill-zips.sh
                  SKILLS=$(find skills -maxdepth 1 -mindepth 1 -type d \
                      -not -name shared | wc -l | xargs)
                  ZIPS=$(ls dist/*.zip 2>/dev/null | wc -l | xargs)
                  if [ "$SKILLS" != "$ZIPS" ]; then
                      echo "::error::Expected $SKILLS zips, got $ZIPS"
                      exit 1
                  fi
                  for z in dist/*.zip; do
                      unzip -l "$z" | grep -q 'SKILL.md' \
                          || { echo "::error::$z missing SKILL.md"; exit 1; }
                  done
                  echo "All $ZIPS skill zips valid"

    release:
        needs: [lint]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Read version from plugin.json
              id: version
              run: |
                  VERSION=$(jq -r '.version' \
                      .claude-plugin/plugin.json)
                  if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
                      echo "::error::No version in plugin.json"; exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

            - name: Check if tag exists
              id: check_tag
              run: |
                  if git ls-remote --tags origin \
                      "refs/tags/${{ steps.version.outputs.tag }}" \
                      | grep -q .; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build skill zips
              if: steps.check_tag.outputs.exists == 'false'
              run: ./scripts/build-skill-zips.sh

            - name: Create release
              if: steps.check_tag.outputs.exists == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create \
                      "${{ steps.version.outputs.tag }}" \
                      dist/*.zip \
                      --title "v${{ steps.version.outputs.version }}" \
                      --generate-notes
